# Merged over ../collector.yaml by the check: everything goes to a file instead of Veyra.
exporters:
  file:
    path: /out/telemetry.jsonl

# A read that sends log records first runs one interval after the Collector starts; the check collects for 90 seconds,
# so the backup history (every 5 minutes in the template) is read every 30 seconds here.
receivers:
  sqlquery/backups:
    collection_interval: 30s

service:
  pipelines:
    metrics:
      exporters:
        - file
    metrics/queries:
      exporters:
        - file
    logs/live:
      exporters:
        - file
    logs/probe:
      exporters:
        - file
