# Veyra and PostgreSQL (ADR 0006). Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Settings come from deploy/.env; copy deploy/.env.example and fill it in. Never commit deploy/.env.
# For a public server with TLS, add deploy/docker-compose.caddy.yml (see docs/guides/deployment.md).

name: veyra

services:
  veyra:
    image: veyra:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # GSS encryption (Kerberos) is off: the image has no Kerberos library and the database is on the same host.
      Veyra__Storage__ConnectionString: >-
        Host=postgres;Database=veyra;Username=veyra;Gss Encryption Mode=Disable;
        Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      Veyra__Storage__LogRetentionDays: ${VEYRA_LOG_RETENTION_DAYS:-14}
      # Empty means no size budget.
      Veyra__Storage__MaxLogStorageGigabytes: ${VEYRA_MAX_LOG_STORAGE_GB:-}
      # Metrics (ADR 0010): days of points kept, and how many series Veyra accepts before it drops new ones.
      Veyra__Storage__MetricRetentionDays: ${VEYRA_METRIC_RETENTION_DAYS:-30}
      Veyra__Storage__MaxMetricSeries: ${VEYRA_MAX_METRIC_SERIES:-50000}
      # Sign-in attempts and ended sessions, with addresses, are kept this many days (ADR 0011).
      Veyra__Access__SignInHistoryDays: ${VEYRA_SIGN_IN_HISTORY_DAYS:-90}
      # The last way back in for an Admin who lost phone and recovery codes. Empty almost always; see
      # docs/guides/deployment.md, Troubleshooting.
      Veyra__Access__RemoveSecondFactor: ${VEYRA_REMOVE_SECOND_FACTOR:-}
      # Alert notifications (docs/architecture/alerting.md). Links in messages use the public address; without it
      # they carry none. Without an SMTP host, email channels cannot send.
      Veyra__Alerting__PublicUrl: ${VEYRA_PUBLIC_URL:-}
      Veyra__Alerting__Notifications__Smtp__Host: ${VEYRA_SMTP_HOST:-}
      Veyra__Alerting__Notifications__Smtp__Port: ${VEYRA_SMTP_PORT:-587}
      Veyra__Alerting__Notifications__Smtp__Security: ${VEYRA_SMTP_SECURITY:-Auto}
      Veyra__Alerting__Notifications__Smtp__Username: ${VEYRA_SMTP_USERNAME:-}
      Veyra__Alerting__Notifications__Smtp__Password: ${VEYRA_SMTP_PASSWORD:-}
      Veyra__Alerting__Notifications__Smtp__From: ${VEYRA_SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Data protection keys. Without them every restart signs everyone out.
      - veyra-keys:/home/app/.aspnet/DataProtection-Keys
    # Reachable from this machine only. Public traffic goes through the reverse proxy.
    ports:
      - "127.0.0.1:${VEYRA_HTTP_PORT:-8080}:8080"
      # OTLP for senders on this machine, such as a Collector watching the host. Remote senders use the public
      # address through Caddy, which adds TLS.
      - "127.0.0.1:${VEYRA_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${VEYRA_OTLP_HTTP_PORT:-4318}:4318"

  postgres:
    # Major version 18, the version the integration tests run against.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veyra
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18, so the volume mounts one level up.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=veyra --dbname=veyra"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  veyra-keys:
