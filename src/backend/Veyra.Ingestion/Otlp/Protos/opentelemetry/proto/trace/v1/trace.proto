syntax = "proto3";

package opentelemetry.proto.trace.v1;

import "opentelemetry/proto/common/v1/common.proto";
import "opentelemetry/proto/resource/v1/resource.proto";

option csharp_namespace = "OpenTelemetry.Proto.Trace.V1";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.trace.v1";
option java_outer_classname = "TraceProto";
option go_package = "go.opentelemetry.io/proto/otlp/trace/v1";

// TracesData represents the traces data that can be stored in a persistent storage,
// OR can be embedded by other protocols that transfer OTLP traces data but do
// not implement the OTLP protocol.
message TracesData {
  // An array of ResourceSpans.
  repeated ResourceSpans resource_spans = 1;
}

// A collection of ScopeSpans from a Resource.
message ResourceSpans {
  reserved 1000;

  // The resource for the spans in this message.
  opentelemetry.proto.resource.v1.Resource resource = 1;

  // A list of ScopeSpans that originate from a resource.
  repeated ScopeSpans scope_spans = 2;

  // The Schema URL of the resource data.
  string schema_url = 3;
}

// A collection of Spans produced by an InstrumentationScope.
message ScopeSpans {
  // The instrumentation scope information for the spans in this message.
  opentelemetry.proto.common.v1.InstrumentationScope scope = 1;

  // A list of Spans that originate from an instrumentation scope.
  repeated Span spans = 2;

  // The Schema URL of the span data.
  string schema_url = 3;
}

// A Span represents a single operation performed by a single component of the system.
message Span {
  // A unique identifier for a trace: 16 bytes, not all zero.
  bytes trace_id = 1;

  // A unique identifier for a span within a trace: 8 bytes, not all zero.
  bytes span_id = 2;

  // trace_state conveys information about request position in multiple distributed tracing graphs.
  string trace_state = 3;

  // The span_id of this span's parent span. Empty for a root span.
  bytes parent_span_id = 4;

  // Flags, a bit field: the lower 8 bits are the W3C trace flags.
  fixed32 flags = 16;

  // A description of the span's operation.
  string name = 5;

  // SpanKind is the type of span.
  enum SpanKind {
    SPAN_KIND_UNSPECIFIED = 0;
    SPAN_KIND_INTERNAL = 1;
    SPAN_KIND_SERVER = 2;
    SPAN_KIND_CLIENT = 3;
    SPAN_KIND_PRODUCER = 4;
    SPAN_KIND_CONSUMER = 5;
  }

  // The type of span.
  SpanKind kind = 6;

  // The start time of the span, in nanoseconds since the Unix epoch.
  fixed64 start_time_unix_nano = 7;

  // The end time of the span, in nanoseconds since the Unix epoch.
  fixed64 end_time_unix_nano = 8;

  // A collection of key/value pairs.
  repeated opentelemetry.proto.common.v1.KeyValue attributes = 9;

  // The number of attributes that were discarded.
  uint32 dropped_attributes_count = 10;

  // Event is a time-stamped annotation of the span.
  message Event {
    // The time the event occurred.
    fixed64 time_unix_nano = 1;

    // The name of the event.
    string name = 2;

    // A collection of attribute key/value pairs on the event.
    repeated opentelemetry.proto.common.v1.KeyValue attributes = 3;

    // The number of dropped attributes.
    uint32 dropped_attributes_count = 4;
  }

  // A collection of Event items.
  repeated Event events = 11;

  // The number of dropped events.
  uint32 dropped_events_count = 12;

  // A pointer from the current span to another span in the same trace or in a different trace.
  message Link {
    // A unique identifier of a trace that this linked span is part of.
    bytes trace_id = 1;

    // A unique identifier for the linked span.
    bytes span_id = 2;

    // The trace_state associated with the link.
    string trace_state = 3;

    // A collection of attribute key/value pairs on the link.
    repeated opentelemetry.proto.common.v1.KeyValue attributes = 4;

    // The number of dropped attributes.
    uint32 dropped_attributes_count = 5;

    // Flags, a bit field, as on the span.
    fixed32 flags = 6;
  }

  // A collection of Links.
  repeated Link links = 13;

  // The number of dropped links.
  uint32 dropped_links_count = 14;

  // An optional final status for this span.
  Status status = 15;
}

// The Status type defines a logical error model.
message Status {
  reserved 1;

  // A developer-facing human readable error message.
  string message = 2;

  // For the semantics of status codes see the OpenTelemetry specification.
  enum StatusCode {
    STATUS_CODE_UNSET = 0;
    STATUS_CODE_OK = 1;
    STATUS_CODE_ERROR = 2;
  };

  // The status code.
  StatusCode code = 3;
}

// SpanFlags represents constants used to interpret the Span.flags field.
enum SpanFlags {
  SPAN_FLAGS_DO_NOT_USE = 0;
  SPAN_FLAGS_TRACE_FLAGS_MASK = 0x000000FF;
  SPAN_FLAGS_CONTEXT_HAS_IS_REMOTE_MASK = 0x00000100;
  SPAN_FLAGS_CONTEXT_IS_REMOTE_MASK = 0x00000200;
}
