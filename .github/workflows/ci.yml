# Builds, tests, and checks formatting on every push and pull request.
# A red run blocks merging: the build treats warnings, missing XML comments, and style violations as errors.
name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

# Read-only access is enough: the workflow only checks code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The SDK version comes from global.json, so CI and local builds match.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Veyra.sln

      - name: Build
        run: dotnet build src/Veyra.sln --configuration Release --no-restore

      # Integration tests start PostgreSQL with Testcontainers; GitHub-hosted Ubuntu runners include Docker.
      - name: Test
        run: dotnet test src/Veyra.sln --configuration Release --no-build

      - name: Check formatting
        run: dotnet format src/Veyra.sln --verify-no-changes --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Node 24 matches the frontend stage of deploy/Dockerfile, so CI builds what the image builds.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      # Type-checks, then bundles; a type error fails the build.
      - name: Build
        run: npm run build

      # End-to-end tests run the built app in Chromium at desktop, tablet, and phone sizes (playwright.config.ts).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  # The tested Collector configuration for SQL Server (integrations/sqlserver) against a real server of each supported
  # version: it must send every metric and event Veyra reads, under the attributes Veyra files them by (ADR 0018).
  sqlserver:
    name: SQL Server ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        version: [2019-latest, 2022-latest, 2025-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the Collector configuration
        run: bash integrations/sqlserver/test/run.sh
        env:
          MSSQL_IMAGE_TAG: ${{ matrix.version }}

  # The tested Collector configuration for PostgreSQL (integrations/postgres) against a real server of the oldest and
  # newest supported versions, with and without TLS: every metric Veyra reads, under the attributes Veyra files them by
  # (ADR 0018).
  postgres:
    name: PostgreSQL ${{ matrix.image }}, TLS ${{ matrix.tls }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:14
            tls: "on"
          - image: postgres:16
            tls: "on"
          - image: postgres:18-alpine
            tls: "off"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the Collector configuration
        run: bash integrations/postgres/test/run.sh
        env:
          POSTGRES_IMAGE: ${{ matrix.image }}
          POSTGRES_TLS: ${{ matrix.tls }}

  # The tested Collector configuration for Docker (integrations/docker) against real containers on the runner's own
  # Docker: every container metric Veyra reads, and container logs carrying the container's name (ADR 0018).
  docker:
    name: Docker containers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the Collector configuration
        run: bash integrations/docker/test/run.sh

  # The Windows host configuration against a real Collector on a Windows runner, with IIS serving its default site and
  # an Event Log error of the check's own (VEY-35).
  windows:
    name: Windows host and IIS
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install IIS
        shell: pwsh
        run: Install-WindowsFeature -Name Web-Server | Out-Null

      - name: Download the Collector, checked against its release's checksum
        shell: pwsh
        run: |
          $version = "0.140.1"
          $base = "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v$version"
          $file = "otelcol-contrib_${version}_windows_amd64.tar.gz"
          Invoke-WebRequest "$base/$file" -OutFile $file
          $sums = "opentelemetry-collector-releases_otelcol-contrib_windows_checksums.txt"
          Invoke-WebRequest "$base/$sums" -OutFile sums.txt
          $expected = ((Select-String -Path sums.txt -Pattern ([regex]::Escape($file) + '$')).Line -split '\s+')[0]
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $expected.ToUpperInvariant()) {
            throw "The Collector's checksum does not match its release."
          }
          New-Item -ItemType Directory otelcol | Out-Null
          tar -xzf $file -C otelcol

      - name: Check the Collector configuration
        shell: pwsh
        run: integrations/windows/test/run.ps1 -Collector otelcol/otelcol-contrib.exe -WithIis -WriteEvent
